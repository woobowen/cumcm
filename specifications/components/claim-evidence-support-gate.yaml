  "algorithms": [
    {
      "id": "ALG-001",
      "kind": "PSEUDOCODE",
      "specification": "Stage 1 deterministically validates permitted locators, registry membership, hashes, Source and Run identity, inputs, commit, artifact lineage, and acyclic explicit supersession; Stage 2 lets a read-only reviewer classify mechanically eligible links as SUPPORTS_EXACT, QUALIFIES_ONLY, CONTRADICTS, IRRELEVANT, or ABSTAIN against population or domain, variables, direction, magnitude, time, uncertainty, qualifiers, and causal modality. Claim types are FACT, COMPUTATIONAL_RESULT, ASSUMPTION, LIMITATION, METHOD, CAUSAL, and CONCLUSION; evidence types are SOURCE, RAW_DATA, RUN, FORMULA, TABLE, FIGURE, and TRANSFORMATION. Authority is claim-type-specific: immutable original inputs or registered primary observations directly support input facts, hash-bound Runs directly support declared outputs, derived artifacts inherit the minimum authority and scope of dependencies, secondary sources support only their documented basis, and reviewer statements have none. Strength is NONE, WEAK, MODERATE, or STRONG; scope mismatch gives NONE, exact direct support may reach MODERATE, and complete exact bindings plus required diagnostics may reach STRONG. Promote only with all required mechanical checks, appropriate SUPPORTS_EXACT evidence, at least MODERATE for bounded non-causal claims or STRONG for causal and final claims, disclosed assumptions and limits, no unresolved contradiction, and causal identification for causal claims; every clause is noncompensatory."
    }
  ],
