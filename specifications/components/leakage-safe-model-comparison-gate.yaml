  "algorithms": [
    {
      "id": "a",
      "kind": "PSEUDOCODE",
      "specification": "Validate the immutable freeze and hashes. Verify train/validation/test separation plus declared temporal and group boundaries; reject target or future-derived features. Verify naive and domain baselines and every frozen candidate use only training data for fitting; validation alone may drive feature, hyperparameter, threshold, architecture, early-stop and selection choices. Retain every seed and failed run. Select exactly by the frozen metric direction; apply only the frozen deterministic tie-break. Require frozen robustness, drift/randomization, uncertainty and ablation evidence. Replay the append-only access ledger: any test access before candidate and selection freeze invalidates the run and dependent decisions and demands a newly sealed test. After all checks pass, permit exactly one logged final test evaluation; it cannot change or filter the selected result."
    }
  ],
