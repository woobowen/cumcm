  "algorithms": [
    {
      "id": "ALG-01",
      "kind": "STATE_TRANSITION_TABLE",
      "specification": "CAPTURE canonicalizes allowlisted relative identifiers, argv, sorted maps and SHA-256 hashes. COMPLETE plus exit 0 and verified outputs may become SUCCESS. Nonzero exit is FAILED; missing/truncated output is PARTIAL; replacement makes the prior Run SUPERSEDED. VERIFY recomputes bindings before replay; mutation or identity/environment mismatch emits codes and STALE/REJECTED. REPLAY uses bound argv, directory, seed, config, dependencies and environment, then compares exit, outputs and metrics. Failed, partial, stale and superseded records stay queryable but are ineligible as successful evidence."
    }
  ],
