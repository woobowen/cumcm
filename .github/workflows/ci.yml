name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 002A verifies immutable evidence against its historical subject commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Bootstrap project environment
        run: bash scripts/bootstrap_dev_env.sh
      - name: Run the sole CI command
        run: bash scripts/ci.sh
