version: "1.0.0"
state_machine_source: WORKFLOW.md
required_project_states: [INIT, FOUNDATION_READY, UPSTREAMS_INVENTORIED, UPSTREAMS_STATIC_REVIEWED, CANDIDATES_FROZEN, PRE_ADJUDICATION_EVIDENCE_GATE, ADVERSARIAL_REVIEW_COMPLETE, TESTS_SYNTHESIZED, EVIDENCE_EXECUTED, BLIND_ADJUDICATION_COMPLETE, META_ADJUDICATION_COMPLETE, DECISION_AUDIT_COMPLETE, AUTOMATED_ACCEPTED, AUTOMATED_REJECTED, RETEST_REQUIRED, EVIDENCE_INSUFFICIENT, AUTOMATED_ABSTAINED, STALE, SKILL_PROTOTYPE_READY, DEVELOPMENT_EVALUATED, VALIDATION_EVALUATED, HELD_OUT_EVALUATED, CONTEST_RELEASE_READY]
required_run_states: [PROBLEM_INGESTED, PROBLEM_ANALYZED, DATA_VALIDATED, BASELINE_READY, MODEL_CANDIDATES_READY, MODEL_SELECTED, IMPLEMENTED, PILOT_RUN_READY, EXPERIMENTS_RUNNING, VALIDATED, ROBUSTNESS_CHECKED, FINAL_RUN_READY, EVIDENCE_PACKAGE_READY, STALE, REJECTED]
