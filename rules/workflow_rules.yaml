automated_adjudication: REQUIRED
technical_decision_method: FROZEN_LEXICOGRAPHIC_EVIDENCE_NO_VOTE
team_compliance_review: NON_TECHNICAL_NO_OVERRIDE
stale_source: WORKFLOW.md
git_delivery:
  remote_name: origin
  repository: woobowen/cumcm
  remote_url: https://github.com/woobowen/cumcm.git
  protected_base_branch: main
  preferred_task_branch: feat/phase004c2-claim-scope-repair-validation-2019c
  allow_force_push: false
  allow_agent_merge: false
rules:
  - id: GIT-DELIVERY-001
    title: Verified deterministic changes must be remotely delivered
    level: MUST
    scope: repository
    statement: Completed deterministic project changes must be validated, committed atomically, and pushed to the designated remote task branch before the task is reported as remotely delivered.
    failure_severity: BLOCKER
    enforcement:
      type: manual_and_git_verification
    repair:
      action: Validate, commit, push, and report the remote commit SHA.
    owner: project-foundation
    status: ACTIVE
