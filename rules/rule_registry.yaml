version: "1.0.0"
allowed_levels: [MUST, MUST_NOT, SHOULD, MAY, EXPERIMENTAL]
allowed_failure_severities: [BLOCKER, ERROR, WARNING, INFO]
rules:
  - {id: RAW-001, title: Immutable raw inputs, level: MUST_NOT, scope: raw_inputs, statement: Raw problem and data files must not be silently modified., rationale: Preserve provenance., source: GOALS.md, enforcement: hash_manifest, failure_severity: BLOCKER, stale_effects: all_descendants, repair: register_new_derived_artifact, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: RUN-001, title: Formal results bind Run IDs, level: MUST, scope: formal_results, statement: Every formal result must reference a Run ID., rationale: Enable traceability., source: WORKFLOW.md, enforcement: schema, failure_severity: BLOCKER, stale_effects: dependent_claims, repair: create_valid_run_record, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: RUN-002, title: Runs bind inputs and code, level: MUST, scope: runs, statement: Every Run must bind input hashes and a Git commit., rationale: Enable reproduction., source: WORKFLOW.md, enforcement: run_schema, failure_severity: BLOCKER, stale_effects: run_and_descendants, repair: rerun_with_complete_provenance, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: FINAL-001, title: Validate before final, level: MUST_NOT, scope: models, statement: An unvalidated model must not be marked FINAL., rationale: Prevent false completion., source: WORKFLOW.md, enforcement: state_gate, failure_severity: BLOCKER, stale_effects: final_outputs, repair: validate_or_demote, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: SRC-001, title: External facts bind Sources, level: MUST, scope: facts, statement: Every external fact must reference a registered Source., rationale: Evidence chain., source: GOALS.md, enforcement: source_schema, failure_severity: ERROR, stale_effects: dependent_claims, repair: register_source_or_remove_claim, owner: source_auditor, version: "1.0.0", status: ACTIVE}
  - {id: SEARCH-001, title: Searches follow mode, level: MUST, scope: searches, statement: Every search must comply with the active search mode., rationale: Prevent leakage., source: rules/search_rules.yaml, enforcement: search_log_review, failure_severity: BLOCKER, stale_effects: contaminated_eval, repair: stop_and_record_contamination, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: BENCH-001, title: Freeze held-out Skill, level: MUST, scope: held_out, statement: The Skill must remain frozen during held-out evaluation., rationale: Preserve validity., source: docs/BENCHMARK_POLICY.md, enforcement: version_hash, failure_severity: BLOCKER, stale_effects: held_out_result, repair: discard_and_rerun, owner: eval_owner, version: "1.0.0", status: ACTIVE}
  - {id: BENCH-002, title: Answer exposure demotes case, level: MUST, scope: benchmarks, statement: A case whose answer was viewed must move permanently to development., rationale: Prevent contamination., source: docs/BENCHMARK_POLICY.md, enforcement: contamination_ledger, failure_severity: BLOCKER, stale_effects: validation_results, repair: demote_and_replace_case, owner: eval_owner, version: "1.0.0", status: ACTIVE}
  - {id: STALE-001, title: Propagate changed dependencies, level: MUST, scope: dependencies, statement: Upstream data or Final Run changes must mark downstream outputs STALE., rationale: Prevent obsolete claims., source: WORKFLOW.md, enforcement: dependency_check, failure_severity: BLOCKER, stale_effects: all_descendants, repair: recompute_and_review, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: UPSTREAM-001, title: Isolate candidates, level: MUST_NOT, scope: upstreams, statement: Third-party candidates must not enter the formal Skill directory., rationale: Avoid discovery and license pollution., source: docs/THIRD_PARTY_POLICY.md, enforcement: discovery_check, failure_severity: BLOCKER, stale_effects: skill_release, repair: remove_exact_candidate_addition_and_audit, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: UPSTREAM-002, title: No unaudited execution, level: MUST_NOT, scope: upstreams, statement: Unaudited third-party scripts must not execute., rationale: Security., source: docs/SECURITY.md, enforcement: process_policy, failure_severity: BLOCKER, stale_effects: environment_and_results, repair: stop_record_rebuild_environment, owner: security_reviewer, version: "1.0.0", status: ACTIVE}
  - {id: AGENT-001, title: Main agent owns formal state, level: MUST, scope: formal_state, statement: Only the main agent may write formal state., rationale: Single writer consistency., source: docs/ARCHITECTURE.md, enforcement: review_policy, failure_severity: ERROR, stale_effects: state_and_reports, repair: review_and_reconcile, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: AGENT-002, title: Subagents read only, level: MUST, scope: subagents, statement: Subagents are read-only unless an explicit conflict-free plan says otherwise., rationale: Avoid conflicting writes., source: docs/REVIEW_POLICY.md, enforcement: delegation_scope, failure_severity: ERROR, stale_effects: touched_artifacts, repair: inspect_and_reconcile, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: EVID-001, title: Votes are not evidence, level: MUST_NOT, scope: decisions, statement: Agent majority opinions must not replace mathematical data or experiment evidence., rationale: Epistemic integrity., source: GOALS.md, enforcement: decision_review, failure_severity: ERROR, stale_effects: decision_descendants, repair: obtain_direct_evidence, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: HANDOFF-001, title: Validate Evidence Package, level: MUST, scope: handoff, statement: Every final Evidence Package must pass its Schema., rationale: Complete interface., source: contracts/modeling_to_paper.schema.json, enforcement: jsonschema, failure_severity: BLOCKER, stale_effects: paper_handoff, repair: fix_package_and_revalidate, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: PAPER-001, title: Paper cannot rewrite facts, level: MUST_NOT, scope: paper_interface, statement: The paper team must not modify experimental facts., rationale: Preserve evidence truth., source: docs/MODELING_TO_PAPER_INTERFACE.md, enforcement: contract_review, failure_severity: BLOCKER, stale_effects: paper_claims, repair: return_change_to_modeling_workflow, owner: team, version: "1.0.0", status: ACTIVE}
  - {id: REPORT-001, title: Generated reports are read-only, level: MUST_NOT, scope: reports, statement: Derived reports must not be edited manually., rationale: Avoid duplicate truth., source: docs/SOURCE_OF_TRUTH.md, enforcement: render_check, failure_severity: ERROR, stale_effects: report_only, repair: regenerate_from_state, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: TRUTH-001, title: Never fabricate status, level: MUST_NOT, scope: all, statement: Runs sources and completion status must not be fabricated., rationale: Truthfulness., source: GOALS.md, enforcement: evidence_review, failure_severity: BLOCKER, stale_effects: all_affected, repair: retract_and_record_unknown, owner: all, version: "1.0.0", status: ACTIVE}
