rules:
  - {id: ADJ-001, level: MUST_NOT, scope: technical_decisions, statement: Technical decisions must not be completed by a subjective human gate., rationale: Decisions must be evidence-replayable., evidence_level: E2, enforcement: decision_audit, failure_severity: BLOCKER, stale_effects: [technical_decisions], repair: rerun_automated_adjudication, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-002, level: MUST_NOT, scope: technical_decisions, statement: Agent majority votes must not determine technical decisions., rationale: Votes are not evidence., evidence_level: E2, enforcement: decision_audit, failure_severity: BLOCKER, stale_effects: [technical_decisions], repair: apply_lexicographic_policy, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-003, level: MUST_NOT, scope: hard_gates, statement: Hard failures must not be averaged away., rationale: Safety and correctness failures dominate soft scores., evidence_level: E3, enforcement: meta_adjudicator, failure_severity: BLOCKER, stale_effects: [decision], repair: reject_or_retest, owner: meta_adjudicator, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-004, level: MUST_NOT, scope: ranking, statement: Recovery-affected evidence must not enter comparative ranking., rationale: Recovery changes the treatment., evidence_level: E2, enforcement: eligibility_classifier, failure_severity: BLOCKER, stale_effects: [ranking], repair: recompute_eligible_subset, owner: eval_owner, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-005, level: MUST_NOT, scope: scoring, statement: Structured coverage must not be labeled correctness., rationale: Keyword presence is not semantic truth., evidence_level: E3, enforcement: score_schema_and_tests, failure_severity: ERROR, stale_effects: [scores,reports], repair: separate_score_channels, owner: eval_owner, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-006, level: MUST_NOT, scope: meta_adjudication, statement: Meta-Adjudicator must not change frozen rules., rationale: Prevent post-hoc thresholds., evidence_level: E2, enforcement: policy_hash, failure_severity: BLOCKER, stale_effects: [meta,decision], repair: rerun_with_frozen_policy, owner: meta_adjudicator, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-007, level: MUST_NOT, scope: formal_state, statement: Formal state must not update unless Decision Auditor passes., rationale: Separate decision from verification., evidence_level: E2, enforcement: state_transition, failure_severity: BLOCKER, stale_effects: [state], repair: audit_then_transition, owner: main_agent, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-008, level: MUST, scope: decisions, statement: The system must support automated abstention., rationale: Uncertainty is a valid result., evidence_level: E3, enforcement: decision_engine_tests, failure_severity: ERROR, stale_effects: [decision], repair: enable_abstention, owner: eval_owner, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-009, level: MUST, scope: decisions, statement: The system must allow every candidate to be rejected., rationale: Selection is not mandatory., evidence_level: E3, enforcement: decision_engine_tests, failure_severity: ERROR, stale_effects: [decision], repair: enable_all_reject, owner: eval_owner, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-010, level: MUST, scope: dissent, statement: Serious testable dissent must become a test request., rationale: Convert claims into executable evidence., evidence_level: E2, enforcement: test_synthesis, failure_severity: BLOCKER, stale_effects: [meta,decision], repair: synthesize_and_execute_test, owner: dissent_judge, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-011, level: MUST_NOT, scope: agent_claims, statement: Agent claims without executable evidence must not independently pass a target., rationale: E0 is not sufficient evidence., evidence_level: E1, enforcement: meta_adjudicator, failure_severity: ERROR, stale_effects: [decision], repair: obtain_evidence_or_record_uncertainty, owner: meta_adjudicator, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-012, level: MUST_NOT, scope: reports, statement: Reports must not hardcode recommendations or runtime results., rationale: Reports are derived views., evidence_level: E3, enforcement: mutation_test, failure_severity: BLOCKER, stale_effects: [reports], repair: render_from_decisions, owner: report_generator, version: "1.0.0", status: ACTIVE}
  - {id: ADJ-013, level: MUST_NOT, scope: blind_judges, statement: Candidate identity must not enter first-round Judge input., rationale: Limit identity bias., evidence_level: E2, enforcement: bundle_scan, failure_severity: BLOCKER, stale_effects: [judge_outputs], repair: reanonymize_and_rerun, owner: orchestrator, version: "1.0.0", status: ACTIVE}
