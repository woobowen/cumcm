  - {id: ADJ-015, level: MUST_NOT, scope: team_review, statement: Competition compliance review must not override technical rejection., rationale: Compliance is not technical evidence., evidence_level: E2, enforcement: team_review_schema, failure_severity: BLOCKER, stale_effects: [team_review], repair: restore_technical_decision, owner: team, version: "1.0.0", status: ACTIVE}
